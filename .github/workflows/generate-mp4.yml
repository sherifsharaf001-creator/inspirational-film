name: Generate MP4 Fast

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Recording duration in seconds"
        required: true
        default: "100"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Render HTML to MP4
        env:
          RECORD_SECONDS: ${{ inputs.duration_seconds }}
        run: npm run render

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: inspirational-film-mp4
          path: output/inspirational-film.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
